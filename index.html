
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>LION_THIPPILA | Portfolio</title>

  <meta name="description" content="Portfolio of Siraphop Thippila (LION_THIPPILA)">
  <meta name="theme-color" content="#0a0a0f">
  <meta property="og:title" content="LION_THIPPILA | Portfolio" />
  <meta property="og:description" content="Siraphop Thippila's personal website" />
  <meta property="og:image" content="https://img2.pic.in.th/pic/S__29982724.jpg" />
  <meta property="og:url" content="https://lionthippila.github.io/" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
  <link rel="apple-touch-icon" href="icon.png">

  <style>
    :root {
      --bg: #09090d;
      --surface: rgba(255,255,255,.055);
      --surface-hover: rgba(255,255,255,.09);
      --text: #f5f5f7;
      --muted: #92929e;
      --accent: #ff454f;
      --accent2: #ff737b;
      --border: rgba(255,255,255,.09);
      --radius: 24px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background:
        radial-gradient(circle at 75% 18%, rgba(255,69,79,.15), transparent 24rem),
        radial-gradient(circle at 12% 72%, rgba(125,40,60,.10), transparent 28rem),
        linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: auto, auto, 48px 48px, 48px 48px;
    }

    /* Background decoration */
    .ambient {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      filter: blur(120px);
      opacity: .13;
      pointer-events: none;
      z-index: -1;
      animation: ambientFloat 12s ease-in-out infinite alternate;
    }

    .ambient-one {
      background: #ff2638;
      top: -160px;
      left: -150px;
    }

    .ambient-two {
      background: #772cff;
      bottom: -200px;
      right: -150px;
      animation-delay: -5s;
    }

    @keyframes ambientFloat {
      from { transform: translate(0,0); }
      to { transform: translate(80px,50px); }
    }

    /* Navigation */
    .navbar {
      width: min(92%, 1120px);
      margin: 28px auto 0;
      position: sticky;
      top: 18px;
      z-index: 100;
      padding: 8px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(15,15,20,.72);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 10px 40px rgba(0,0,0,.2);
      animation: navEnter .8s ease both;
    }

    @keyframes navEnter {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .nav-links {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--muted);
      font-size: .85rem;
      font-weight: 600;
      padding: 11px 16px;
      border-radius: 12px;
      transition: .3s ease;
    }

    .nav-links a:hover {
      color: #fff;
      background: var(--surface-hover);
      transform: translateY(-2px);
    }

    .nav-links a.active {
      color: white;
      background: linear-gradient(135deg, #ff454f, #c91f35);
      box-shadow: 0 4px 20px rgba(255,69,79,.25);
    }

    /* Main hero */
    .main {
      width: min(100% - 32px, 1120px);
      margin: 0 auto;
      min-height: calc(100vh - 118px);
      padding: 76px 24px 40px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 390px;
      grid-template-areas:
        "copy cards"
        "social cards";
      align-items: center;
      column-gap: 64px;
      row-gap: 28px;
      max-width: 1020px;
      margin: 0 auto;
    }

    .hero-copy {
      grid-area: copy;
      text-align: left;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      border-radius: 50px;
      border: 1px solid rgba(255,69,79,.25);
      background: rgba(255,69,79,.07);
      color: #ff777f;
      font-size: .76rem;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 24px;
      animation: fadeUp .8s .15s both;
    }

    .badge::before {
      content: "";
      width: 7px;
      height: 7px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 12px var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      50% { opacity: .4; transform: scale(.8); }
    }

    h1 {
      font-size: clamp(2.6rem, 7vw, 5.6rem);
      font-weight: 900;
      letter-spacing: -5px;
      line-height: 1.05;
      margin-bottom: 22px;
      animation: fadeUp .9s .3s both;
    }

    h1 .highlight {
      background: linear-gradient(120deg, #fff 20%, #ff858b 55%, #ff454f 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .description {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.8;
      min-height: 32px;
      max-width: 700px;
      margin: 0;
      animation: fadeUp .9s .45s both;
    }

    #cursor {
      display: inline-block;
      color: var(--accent);
      margin-left: 3px;
      animation: blink .8s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Profile cards */
    .cards {
      grid-area: cards;
      display: grid;
      place-items: center;
      gap: 20px;
      width: 390px;
    }

    .card {
      position: relative;
      width: 390px;
      aspect-ratio: 1/1;
      overflow: hidden;
      border-radius: 32px;
      background: #121218;
      border: 1px solid rgba(255,255,255,.08);
      isolation: isolate;
      transform: translateY(35px);
      opacity: 0;
      animation: cardEnter .9s .6s ease forwards;
      transition: transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .5s, border-color .5s;
    }

    @keyframes cardEnter {
      to { opacity: 1; transform: translateY(0); }
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(180deg, transparent 65%, rgba(0,0,0,.35));
      z-index: 3;
      pointer-events: none;
    }

    .card:hover {
      transform: translateY(-10px) scale(1.025);
      border-color: rgba(255,69,79,.45);
      box-shadow:
        0 20px 60px rgba(255,40,60,.12),
        0 0 25px rgba(255,69,79,.07);
    }

    .card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity .6s ease, transform .9s cubic-bezier(.2,.8,.2,1);
    }

    .card .default-img {
      opacity: 1;
    }

    .card .hover-img {
      opacity: 0;
    }

    .card:hover .default-img {
      opacity: 0;
      transform: scale(1.08);
    }

    .card:hover .hover-img {
      opacity: 1;
      transform: scale(1.08);
    }

    /* Social buttons */
    .social-icons {
      grid-area: social;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      margin-top: 34px;
      animation: fadeUp 1s 1s both;
    }

    .btn {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      color: #fff;
      text-decoration: none;
      border-radius: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(10px);
      transition: transform .35s, background .35s, border-color .35s, box-shadow .35s;
    }

    .btn:hover {
      transform: translateY(-6px) rotate(-4deg);
      background: rgba(255,69,79,.12);
      border-color: rgba(255,69,79,.5);
      box-shadow: 0 8px 25px rgba(255,69,79,.12);
      color: #ff737b;
    }

    .music-toggle {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 110;
      cursor: pointer;
    }

    /* Footer */
    footer {
      text-align: center;
      color: #62626e;
      padding: 30px 15px 40px;
      font-size: .82rem;
      margin-top: 70px;
      border-top: 1px solid rgba(255,255,255,.05);
      animation: fadeUp 1s 1.2s both;
    }

    footer span {
      color: #ff6b75;
    }

    /* Responsive */
    @media (max-width: 860px) {
      h1 {
        letter-spacing: -1.5px;
      }

      .hero {
        grid-template-columns: 1fr;
        grid-template-areas:
          "copy"
          "cards"
          "social";
        gap: 32px;
        text-align: center;
      }

      .hero-copy {
        text-align: center;
      }

      .description,
      .social-icons {
        margin-left: auto;
        margin-right: auto;
        justify-content: center;
      }

      .cards,
      .card {
        width: min(100%, 390px);
      }

      .cards {
        margin: 0 auto;
      }
    }

    @media (max-width: 700px) {
      .navbar {
        width: calc(100% - 24px);
        top: 10px;
        margin-top: 14px;
        padding: 8px;
        border-radius: 14px;
      }

      .nav-links {
        gap: 4px;
      }

      .nav-links a {
        padding: 10px 12px;
        font-size: .78rem;
      }

      .main {
        padding: 70px 16px 30px;
      }

      .music-toggle {
        right: 16px;
        bottom: 16px;
      }

      h1 {
        letter-spacing: -2px;
        font-size: clamp(2.3rem, 11vw, 4rem);
      }

      .card {
        width: min(100%, 360px);
      }

      .social-icons {
        margin-top: 8px;
      }

      footer {
        margin-top: 55px;
      }
    }

    @media (max-width: 380px) {
      .nav-links a {
        padding: 9px 10px;
        font-size: .72rem;
      }

      .badge {
        font-size: .68rem;
      }

      .description {
        font-size: .9rem;
      }
    }

    /* Accessibility */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>

  <script src="music.js"></script>
  <script>
    // Typing animation
    const text = "Hello! Welcome to my portfolio. Thanks for visiting my site!";
    const typingSpeed = 55;
    const deletingSpeed = 30;
    const pauseTime = 1800;

    const el = document.getElementById("typing-text");
    let i = 0;
    let isDeleting = false;

    function typeLoop() {
      const currentText = isDeleting
        ? text.substring(0, i - 1)
        : text.substring(0, i + 1);

      el.textContent = currentText;

      const cursor = document.createElement("span");
      cursor.id = "cursor";
      cursor.textContent = "|";
      el.appendChild(cursor);

      if (!isDeleting && i < text.length) {
        i++;
        setTimeout(typeLoop, typingSpeed);
      } else if (!isDeleting && i === text.length) {
        isDeleting = true;
        setTimeout(typeLoop, pauseTime);
      } else if (isDeleting && i > 0) {
        i--;
        setTimeout(typeLoop, deletingSpeed);
      } else {
        isDeleting = false;
        setTimeout(typeLoop, pauseTime);
      }
    }

    typeLoop();

    // Footer year
    document.getElementById("year").textContent = new Date().getFullYear();

    // Navbar active effect
    document.querySelectorAll(".nav-links a").forEach(link => {
      link.addEventListener("click", function() {
        document.querySelectorAll(".nav-links a").forEach(a => {
          a.classList.remove("active");
        });
        this.classList.add("active");
      });
    });

    AOS.init();

    anime.timeline({ loop: false }).add({
      targets: '.ml13 .letter',
      translateY: [50, 0],
      translateZ: 0,
      opacity: [0, 1],
      easing: "easeOutExpo",
      duration: 1400,
      delay: (el, i) => 300 + 30 * i
    });

    document.querySelectorAll('.nav-links a').forEach(link => {
      link.addEventListener('click', function() {
        document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
        this.classList.add('active');
      });
    });
  </script>

</body>
